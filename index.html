<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111b1b"><title>شرائح — قصّ الصورة بطريقتك</title><style>
*{box-sizing:border-box} :root{font-family:Tahoma,Arial,sans-serif;color:#eaf1ed;background:#101817;color-scheme:dark}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:wait}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #bfe18b;outline-offset:4px}.app{height:100dvh;min-height:480px;display:flex;flex-direction:column;padding:24px 36px;gap:22px;max-width:1600px;margin:auto}header{display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:bold;letter-spacing:-1px}.brand span{color:#bfe18b}.privacy{font-size:12px;color:#a5b7ad}.workspace{flex:1;min-height:0;display:flex;gap:24px}.stage{flex:1;min-width:0;position:relative;border:1px solid #2c3d36;border-radius:24px;background:radial-gradient(ellipse at center,#263930,#14201b);overflow:hidden;display:flex;align-items:center;justify-content:center;padding:24px}.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;width:100%;height:100%;border:1px dashed #66806d;border-radius:16px;cursor:pointer;text-align:center}.drop strong{font-size:clamp(18px,2.5vw,30px);font-weight:normal}.upload-icon{width:72px;height:72px;border-radius:22px;background:#bfe18b;color:#1a2c20;display:grid;place-items:center;font-size:36px}.hint{font-size:13px;color:#9eb1a3}.dragging{outline:2px solid #bfe18b;outline-offset:-4px}#preview{width:100%;height:100%;object-fit:contain;display:none;cursor:zoom-in}aside{width:290px;display:flex;flex-direction:column;gap:19px;padding:10px 0;overflow:auto}h1{font-size:22px;margin:0 0 7px}p{margin:0;color:#9fb1a5;font-size:13px;line-height:1.7}.field{display:flex;flex-direction:column;gap:10px}.label{display:flex;justify-content:space-between;font-size:13px;align-items:center}.controls{display:flex;gap:10px;align-items:center}input[type=range]{width:100%;accent-color:#bfe18b;cursor:pointer}input[type=number]{width:65px;background:#1e2b24;border:1px solid #405045;border-radius:8px;padding:8px;text-align:center}select{width:100%;background:#1e2b24;border:1px solid #405045;padding:10px;border-radius:10px}.small{font-size:11px;color:#9fb1a5}.divider{height:1px;background:#2c3d36}.primary{background:#c5e59a;color:#17251c;border:0;padding:15px;border-radius:12px;font-weight:bold;width:100%}.secondary{background:transparent;color:#cbd9cf;border:1px solid #3c5144;padding:10px;border-radius:10px}.actions{margin-top:auto;display:flex;flex-direction:column;gap:10px}#message{font-size:12px;min-height:16px;color:#d1e6b8}footer{display:flex;justify-content:space-between;color:#80978a;font-size:11px}.badge{position:absolute;bottom:14px;left:16px;font-size:11px;padding:7px 10px;border-radius:9px;background:#111c17d9;color:#b5c8ba;pointer-events:none}dialog{border:1px solid #49614f;border-radius:24px;background:#14201b;color:#eaf1ed;max-height:90dvh;max-width:90vw;padding:20px;text-align:center}dialog::backdrop{background:#000b}#single{display:block;max-height:67dvh;max-width:75vw;margin:12px auto}dialog button{margin:4px}.hidden{display:none!important}@media(max-width:700px){.app{padding:16px;gap:12px;min-height:560px}.workspace{flex-direction:column;gap:12px}.stage{min-height:0;flex:1;border-radius:18px;padding:15px}aside{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:12px;overflow:visible;padding:0}.intro,.divider,.extra,.hint-info{display:none}.actions{grid-column:1/-1;display:grid;grid-template-columns:1fr auto;gap:10px}#message{grid-column:1/-1;min-height:0}.label{font-size:12px}.field{gap:5px}input[type=number]{padding:5px;width:53px}.primary{padding:12px}.privacy{font-size:10px}.brand{font-size:21px}footer{font-size:10px}.upload-icon{width:55px;height:55px;font-size:28px}.badge{bottom:6px;left:8px}.drop{gap:15px}}@media(max-height:700px) and (min-width:701px){.app{padding:15px 25px;gap:12px}aside{gap:12px}.intro p{display:none}} 
.empty aside{display:none}.intro{display:none}aside{overflow:visible;gap:16px}.upload-icon{font-family:Arial}.empty .stage{max-width:100%}@media(max-height:600px){.app{min-height:0;padding:10px;gap:8px}aside{gap:7px}.hint-info,footer{display:none}.field{gap:3px}} </style></head><body><main class="app empty" id="app"><header><div class="brand"><span>▥</span> شرائح</div><div class="privacy">◉ صورك تبقى على جهازك</div></header><div class="workspace"><section class="stage" id="stage" aria-label="معاينة الصورة"><label class="drop" id="drop" for="file"><span class="upload-icon"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 16V3m-5 5 5-5 5 5M4 15v5a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5"/></svg></span><strong>أرفق الصورة أو اسحبها هنا</strong><span class="hint">JPG · PNG · WebP</span></label><input class="hidden" id="file" type="file" accept="image/jpeg,image/png,image/webp"><canvas id="preview" aria-label="معاينة الشرائح؛ اضغط على شريحة لعرضها وحدها"></canvas><span class="badge hidden" id="badge">اضغط على أي شريحة لفتحها</span></section><aside><div class="intro"><h1>صورة واحدة.<br>احتمالات كثيرة.</h1><p>قسّمها إلى شرائح طولية، واضبط الأطراف كما تحب.</p></div><div class="divider"></div><div class="field"><label class="label" for="count">عدد الشرائح <span class="small">٢–٢٠</span></label><div class="controls"><input id="count" type="range" min="2" max="20" value="12"><input id="countN" type="number" aria-label="عدد الشرائح بدقة" min="2" max="20" value="12"></div></div><div class="field"><label class="label" for="curve">انحناء الأطراف <output id="curveOut">100%</output></label><div class="controls"><input id="curve" type="range" min="0" max="100" value="100"><input id="curveN" type="number" aria-label="نسبة انحناء الأطراف" min="0" max="100" value="100"></div></div><div class="field"><label class="label" for="gap">الفاصل بين الشرائح <output id="gapOut">16%</output></label><div class="controls"><input id="gap" type="range" min="0" max="50" value="16"><input id="gapN" type="number" aria-label="نسبة الفاصل" min="0" max="50" value="16"></div></div><div class="field"><label class="label" for="order">ترتيب الترقيم</label><select id="order"><option value="rtl">من اليمين إلى اليسار</option><option value="ltr">من اليسار إلى اليمين</option></select></div><p class="hint-info">أطراف شفافة بصيغة PNG، مع الحفاظ على دقة الصورة الأصلية.</p><div class="actions"><button class="primary" id="download" disabled>تحميل الشرائح ZIP ↓</button><button class="secondary" id="replace">تغيير الصورة</button><div id="message" role="status" aria-live="polite"></div></div></aside></div><footer><span>قصّ محلي • دون رفع أو تسجيل</span><span id="dimensions">جاهز لإبداعك</span></footer></main><dialog id="modal"><div id="singleTitle"></div><canvas id="single"></canvas><button class="primary" id="saveSingle">تحميل هذه الشريحة</button><button class="secondary" id="close">إغلاق</button></dialog><script>
'use strict';
const $=id=>document.getElementById(id);let img=null,filename='strips',busy=false,selected=0,view={};
const values=()=>({n:+$('count').value,curve:+$('curve').value/100,gap:+$('gap').value/100});
for(const id of ['count','curve','gap'])for(const suffix of ['', 'N'])$(id+suffix).addEventListener('input',e=>{const a=$(id),v=Math.max(+a.min,Math.min(+a.max,Math.round(+e.target.value||+a.min)));a.value=$(id+'N').value=v;if(id!=='count')$(id+'Out').textContent=v+'%';render();});
$('order').onchange=render;$('replace').onclick=()=>$('file').click();$('file').onchange=e=>load(e.target.files[0]);
for(const ev of ['dragenter','dragover'])$('stage').addEventListener(ev,e=>{e.preventDefault();$('stage').classList.add('dragging')});for(const ev of ['dragleave','drop'])$('stage').addEventListener(ev,e=>{e.preventDefault();$('stage').classList.remove('dragging')});$('stage').addEventListener('drop',e=>load(e.dataTransfer.files[0]));
async function load(file){if(!file||busy)return;if(!/^image\/(jpeg|png|webp)$/.test(file.type)){ $('message').textContent='اختر صورة JPG أو PNG أو WebP.';return;}const url=URL.createObjectURL(file);try{const next=new Image();next.src=url;await next.decode();if(next.naturalWidth<20)throw Error('small');if(next.naturalWidth*next.naturalHeight>50000000)throw Error('large');img=next;$('app').classList.remove('empty');filename=file.name.replace(/\.[^.]+$/,'');$('drop').classList.add('hidden');$('preview').style.display='block';$('badge').classList.remove('hidden');$('download').disabled=false;$('dimensions').textContent=img.naturalWidth+' × '+img.naturalHeight+' px';$('message').textContent='';render();}catch(e){$('message').textContent=e.message==='large'?'الصورة كبيرة جدًا؛ اختر صورة أقل من ٥٠ مليون بكسل.':'تعذّر قراءة الصورة؛ جرّب صورة أخرى.';}finally{URL.revokeObjectURL(url);$('file').value='';}}
function bounds(index){const {n,gap}=values(),w=img.naturalWidth;const l=Math.round(index*w/n),r=Math.round((index+1)*w/n),inset=Math.round((r-l)*gap/2);return {x:l+inset,w:Math.max(1,r-l-2*inset),h:img.naturalHeight};}
function path(ctx,x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
function paint(ctx,index,x,y,scale){const b=bounds(index),w=b.w*scale,h=b.h*scale;ctx.save();path(ctx,x,y,w,h,w/2*values().curve);ctx.clip();ctx.drawImage(img,b.x,0,b.w,b.h,x,y,w,h);ctx.restore();}
function render(){if(!img)return;const c=$('preview'),rect=$('stage').getBoundingClientRect(),W=Math.max(1,rect.width-48),H=Math.max(1,rect.height-48),dpr=Math.min(devicePixelRatio||1,2);c.width=W*dpr;c.height=H*dpr;const ctx=c.getContext('2d');ctx.scale(dpr,dpr);const scale=Math.min(W/img.naturalWidth,H/img.naturalHeight),ow=img.naturalWidth*scale,oh=img.naturalHeight*scale,x=(W-ow)/2,y=(H-oh)/2;view={x,y,w:ow,h:oh,W,H};for(let i=0;i<values().n;i++)paint(ctx,i,x+bounds(i).x*scale,y,scale);}
new ResizeObserver(render).observe($('stage'));
function slice(index){const b=bounds(index),c=document.createElement('canvas');c.width=b.w;c.height=b.h;paint(c.getContext('2d'),index,0,0,1);return c;}
function number(index){return $('order').value==='rtl'?values().n-index:index+1;}
$('preview').onclick=e=>{if(!img||busy)return;const rect=e.currentTarget.getBoundingClientRect(),x=(e.clientX-rect.left)*view.W/rect.width,y=(e.clientY-rect.top)*view.H/rect.height;if(x<view.x||x>view.x+view.w||y<view.y||y>view.y+view.h)return;selected=Math.min(values().n-1,Math.floor((x-view.x)/view.w*values().n));const c=slice(selected),t=$('single');t.width=c.width;t.height=c.height;t.getContext('2d').drawImage(c,0,0);$('singleTitle').textContent='الشريحة '+number(selected);$('modal').showModal();};$('close').onclick=()=>$('modal').close();$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').close()};
function blob(c){return new Promise((resolve,reject)=>c.toBlob(b=>b?resolve(b):reject(Error('encode')),'image/png'));}function save(data,name){const url=URL.createObjectURL(data),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);}
$('saveSingle').onclick=async()=>{try{save(await blob($('single')),String(number(selected)).padStart(2,'0')+'.png')}catch{$('singleTitle').textContent='تعذّر الحفظ؛ جرّب صورة أصغر.'}};
// ZIP STORE: standard CRC-32, local headers, central directory; no dependencies.
const crcTable=Array.from({length:256},(_,n)=>{for(let k=0;k<8;k++)n=(n&1)?0xedb88320^(n>>>1):n>>>1;return n>>>0});function crc32(a){let c=0xffffffff;for(const v of a)c=crcTable[(c^v)&255]^(c>>>8);return (c^0xffffffff)>>>0;}
function header(size){const a=new Uint8Array(size);return {a,v:new DataView(a.buffer)}}
async function zip(files){let offset=0;const parts=[],central=[];for(const f of files){const name=new TextEncoder().encode(f.name),data=new Uint8Array(await f.blob.arrayBuffer()),crc=crc32(data),l=header(30);l.v.setUint32(0,0x04034b50,true);l.v.setUint16(4,20,true);l.v.setUint32(14,crc,true);l.v.setUint32(18,data.length,true);l.v.setUint32(22,data.length,true);l.v.setUint16(26,name.length,true);parts.push(l.a,name,data);const c=header(46);c.v.setUint32(0,0x02014b50,true);c.v.setUint16(4,20,true);c.v.setUint16(6,20,true);c.v.setUint32(16,crc,true);c.v.setUint32(20,data.length,true);c.v.setUint32(24,data.length,true);c.v.setUint16(28,name.length,true);c.v.setUint32(42,offset,true);central.push(c.a,name);offset+=30+name.length+data.length;}const len=central.reduce((s,a)=>s+a.length,0),end=header(22);end.v.setUint32(0,0x06054b50,true);end.v.setUint16(8,files.length,true);end.v.setUint16(10,files.length,true);end.v.setUint32(12,len,true);end.v.setUint32(16,offset,true);return new Blob([...parts,...central,end.a],{type:'application/zip'});}
$('download').onclick=async()=>{if(!img||busy)return;busy=true;document.querySelectorAll('aside input,aside select,aside button').forEach(e=>e.disabled=true);try{const files=[];for(let i=0;i<values().n;i++){const index=$('order').value==='rtl'?values().n-1-i:i;$('message').textContent='جارٍ تجهيز الشريحة '+(i+1)+' من '+values().n;await new Promise(r=>requestAnimationFrame(r));const c=slice(index);files.push({name:String(i+1).padStart(2,'0')+'.png',blob:await blob(c)});c.width=c.height=0;}save(await zip(files),filename+'-strips.zip');$('message').textContent='تم تجهيز الشرائح ✓';}catch{$('message').textContent='تعذّر التصدير؛ جرّب صورة أصغر.';}finally{busy=false;document.querySelectorAll('aside input,aside select,aside button').forEach(e=>e.disabled=false);}};
</script></body></html>
