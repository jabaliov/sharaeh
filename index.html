<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101817">
<meta name="description" content="حوّل صورتك إلى شرائح وبانوراما وتقريب وتفاصيل وتأثيرات لونية ولوحات تحريرية. معالجة محلية بالكامل.">
<title>شرائح — ست طرق لصورتك</title>
<style>
*{box-sizing:border-box}
 :root{font-family:Tahoma,Arial,sans-serif;color:#e9f0e9;background:#101817;color-scheme:dark}
body{margin:0}
button,input,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:wait}
button,input,select{accent-color:#c5e59a}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #c5e59a;outline-offset:3px}
button{border:0}
button,select,input[type=number]{border-radius:10px}
button{color:inherit}
button:hover:not(:disabled){filter:brightness(1.12)}
.app{height:100dvh;min-height:480px;max-width:1600px;margin:auto;padding:22px 30px;display:flex;flex-direction:column;gap:18px}
header{display:flex;justify-content:space-between;align-items:center}
.brand{font-size:23px;font-weight:bold}
.brand b{color:#c5e59a}
.privacy{font-size:11px;color:#a3b5a6}
.layout{display:flex;gap:22px;flex:1;min-height:0}
.stage{flex:1;min-width:0;border:1px solid #314738;background:radial-gradient(ellipse,#2a3c2e,#15221a);border-radius:22px;position:relative;overflow:hidden;display:flex;flex-direction:column;padding:20px}
.stage.light{background:#edf0e9}
.drop{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;border:1px dashed #6c886c;border-radius:15px;cursor:pointer;text-align:center}
.drop strong{font-weight:normal;font-size:clamp(19px,2.5vw,30px)}
.upload-icon{display:grid;place-items:center;width:64px;height:64px;border-radius:20px;background:#c5e59a;color:#192b1c;font-size:30px}
.hint{font-size:12px;color:#9daf9d}
.stage-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.stage-head strong{font-size:14px}
.stage-head button{font-size:11px;padding:7px 10px}
.stage.light .stage-head{color:#1c3022}
.outputs{display:grid;gap:10px;flex:1;min-height:0;align-items:center;justify-content:center;direction:ltr}
.output{min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:transparent;padding:0;height:100%;overflow:hidden}
.output{justify-content:center}
.output canvas{width:100%;height:100%;max-width:100%;max-height:calc(100% - 20px);object-fit:contain;min-height:0}
.output span{font-size:10px;color:#a6b89e}
.stage.light .output span{color:#405540}
.stage-note{font-size:11px;text-align:center;color:#91a98e;margin:12px 0 0;min-height:14px}
.stage.light .stage-note{color:#52654e}
aside{width:300px;display:flex;flex-direction:column;gap:12px}
.aside-title{font-size:14px;color:#aebfae}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mode{background:#1b2b20;border:1px solid #304737;padding:8px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.mode[aria-pressed=true]{border-color:#c5e59a;background:#2a3e27;box-shadow:0 0 0 1px #c5e59a}
.mode canvas{width:100%;height:65px;object-fit:contain}
.mode span{font-size:11px}
.primary{background:#c5e59a;color:#18281b;padding:13px;font-weight:bold}
.secondary{background:#213328;border:1px solid #405942;padding:11px}
.subtle{background:#1c2d22;border:1px solid #405642;padding:8px}
.actions{display:flex;flex-direction:column;gap:8px;margin-top:auto}
.downloads{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.downloads button{font-size:12px}
#status{font-size:11px;min-height:16px;color:#c1d6ab;line-height:1.5}
footer{display:flex;justify-content:space-between;font-size:10px;color:#819580}
.hidden{display:none!important}
.empty aside,.empty .stage-head,.empty .stage-note,.empty .outputs{display:none}
.empty .drop{display:flex}
.drop{display:none}
.empty .stage{padding:20px}
.dragging{outline:2px solid #c5e59a;outline-offset:-4px}
dialog{border:1px solid #4c674d;border-radius:20px;background:#14231a;color:#e9f0e9;width:min(520px,94vw);max-height:92dvh;padding:22px}
dialog::backdrop{background:#000b}
dialog h2{font-size:19px;margin:0}
dialog p{font-size:12px;line-height:1.7;color:#b0c1ac;margin:10px 0}
.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.close{background:#2c4230;padding:7px 12px;font-size:14px}
.field{display:flex;flex-direction:column;gap:9px;margin:16px 0}
.field label,.label{font-size:12px;display:flex;align-items:center;justify-content:space-between}
.controls{display:flex;gap:10px;align-items:center}
input[type=range]{width:100%}
input[type=number]{width:65px;padding:7px;background:#213628;border:1px solid #405a43;text-align:center}
select{background:#213628;border:1px solid #405a43;padding:10px;color:inherit;width:100%}
input[type=color]{width:50px;height:34px;padding:0;border:0;background:transparent}
.edit-preview{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.result-wrap{height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0c150f;border-radius:12px;padding:8px}
#settingsResult{width:100%;height:calc(100% - 18px);object-fit:contain;min-height:0}
.source-wrap{height:180px;background:#0c150f;border-radius:12px;position:relative;overflow:hidden;display:grid;place-items:center}
#source{width:100%;height:100%;object-fit:contain;touch-action:none;cursor:crosshair}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#243b29;padding:8px;font-size:11px}
.chip[aria-pressed=true]{background:#c5e59a;color:#192b1e}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.modal-actions>*{flex:1}
.single-wrap{height:60dvh;display:grid;place-items:center}
#single{max-height:100%;max-width:100%;object-fit:contain}
.gallery-grid{display:flex;gap:9px;overflow:auto;direction:ltr;padding:10px 0}
.gallery-grid a{flex:0 0 60px;text-align:center;color:#c5e59a;font-size:11px;text-decoration:none}
.gallery-grid img{width:60px;height:95px;object-fit:contain;background:#24392a}
#shareReady{width:100%}
.stat{font-variant-numeric:tabular-nums;color:#c5e59a}
.small{font-size:10px;color:#a0b29b}
.apply{width:100%;margin-top:12px}

@media(max-width:700px){.app{padding:14px;gap:11px;min-height:540px}
.layout{flex-direction:column;gap:11px}
.stage{padding:12px;border-radius:17px}
.brand{font-size:20px}
.privacy{font-size:10px}
aside{width:100%;gap:8px}
.aside-title{display:none}
.modes{grid-template-columns:repeat(3,1fr);gap:6px}
.mode{padding:5px;gap:4px;border-radius:9px}
.mode canvas{height:35px}
.mode span{font-size:10px}
.actions{display:grid;grid-template-columns:auto 1fr;gap:6px}
.downloads{gap:6px}
.actions>.secondary{font-size:11px;padding:9px}
.primary{padding:11px}
.downloads button{font-size:11px}
#status{grid-column:1/-1;min-height:0}
footer{font-size:9px}
.stage-head{margin-bottom:8px}
.stage-note{font-size:10px;margin-top:8px}
.outputs{gap:6px}
.source-wrap,.result-wrap{height:155px}
dialog{padding:17px}
.field{margin:13px 0}
.empty .stage{padding:15px}
}

@media(max-height:620px){.app{padding:10px;gap:7px;min-height:0}
footer{display:none}
.mode canvas{height:28px}
.stage-note{display:none}
aside{gap:7px}
.source-wrap,.result-wrap{height:110px}
}

</style>
</head>
<body>
<main class="app empty" id="app">
<header>
<div class="brand">
<b>▥</b> شرائح</div>
<div class="privacy">◉ صورك تبقى على جهازك</div>
</header>
<div class="layout">
<section class="stage" id="stage" aria-label="معاينة النتيجة">
<label class="drop" id="drop" for="file">
<span class="upload-icon">＋</span>
<strong>أرفق الصورة أو اسحبها هنا</strong>
<span class="hint">JPG · PNG · WebP</span>
</label>
<input type="file" id="file" accept="image/jpeg,image/png,image/webp" hidden>
<div class="stage-head">
<strong id="effectName">شرائح X</strong>
<div>
<button id="theme" class="subtle" aria-label="تبديل خلفية المعاينة">خلفية فاتحة</button> <button id="replace" class="subtle">تغيير الصورة</button>
</div>
</div>
<div class="outputs" id="outputs">
</div>
<p class="stage-note" id="stageNote">
</p>
</section>
<aside>
<div class="aside-title">اختر شكلًا لصورتك</div>
<div class="modes" id="modes">
</div>
<div class="actions">
<button class="secondary" id="settingsOpen">ضبط التأثير ⚙</button>
<div class="downloads">
<button class="primary" id="download" disabled>تحميل ZIP ↓</button>
<button class="primary" id="galleryPrepare" disabled>حفظ في الاستديو</button>
</div>
<div id="status" role="status" aria-live="polite">
</div>
</div>
</aside>
</div>
<footer>
<span>٦ طرق لصورتك · معالجة محلية</span>
<span id="dimensions">جاهز لإبداعك</span>
</footer>
</main>
<dialog id="settings">
<div class="dialog-head">
<h2 id="settingsTitle">ضبط التأثير</h2>
<button class="close" id="settingsClose" aria-label="إغلاق الإعدادات">×</button>
</div>
<p id="focusHelp">
</p>
<div class="edit-preview" id="editPreview">
<div class="source-wrap" id="sourceWrap">
<canvas id="source" aria-label="الصورة الأصلية؛ المس لاختيار نقطة الاهتمام أو اللون واسحب لتغيير موضع القص">
</canvas>
</div>
<div class="result-wrap">
<canvas id="settingsResult" aria-label="معاينة فورية للتعديل">
</canvas>
<span class="small">معاينة فورية</span>
</div>
</div>
<div class="chips" id="detailPoints">
</div>
<div class="field" id="countField">
<label for="count">
<span id="countLabel">عدد الشرائح</span>
<output id="countOut" class="stat">12</output>
</label>
<div class="controls">
<input type="range" id="count" min="2" max="20" value="12">
<input type="number" id="countN" min="2" max="20" value="12" aria-label="العدد بدقة">
</div>
</div>
<div class="field" id="fitField">
<label for="fit">تأطير الصورة</label>
<select id="fit">
<option value="cover">ملء الإطار</option>
<option value="contain">إظهار الصورة كاملة</option>
</select>
</div>
<div class="field" id="ratioField">
<label for="ratio">شكل الإطار</label>
<select id="ratio">
<option value="0.8">طولي 4:5</option>
<option value="1">مربع 1:1</option>
<option value="1.7777777778">عرضي 16:9</option>
<option value="source">نسبة الصورة الأصلية</option>
</select>
</div>
<div class="field" id="zoomField">
<label for="zoom">
<span id="zoomLabel">قوة التقريب</span>
<output id="zoomOut" class="stat">3×</output>
</label>
<input type="range" id="zoom" min="1" max="5" step="0.1" value="3">
</div>
<div class="field" id="colorField">
<label for="color">اللون المحتفظ به <input type="color" id="color" value="#d29940">
</label>
<label for="tolerance">مدى الألوان <output id="toleranceOut" class="stat">30</output>
</label>
<input type="range" id="tolerance" min="5" max="100" value="30">
</div>
<div class="field" id="templateField">
<label for="template">قالب اللوحة</label>
<select id="template">
<option value="triptych">لوحة وتفصيلان</option>
<option value="magazine">صفحة مجلة</option>
<option value="grid">أربع نوافذ</option>
</select>
</div>
<div class="field" id="backgroundField">
<label for="background">لون المساحات حول الصورة <input type="color" id="background" value="#eee9df">
</label>
</div>
<div class="field" id="orderField">
<label for="order">ترتيب الملفات</label>
<select id="order">
<option value="rtl">من اليمين إلى اليسار</option>
<option value="ltr">من اليسار إلى اليمين</option>
</select>
</div>
<div class="field" id="curveField">
<label for="curve">انحناء داخل الملف <output id="curveOut" class="stat">0%</output>
</label>
<input type="range" id="curve" min="0" max="100" value="0">
<span class="small">للنشر في X اتركه صفرًا؛ الواجهة تصنع الانحناء.</span>
</div>
<div class="field" id="gapField">
<label for="gap">قصّ من جانبي الشريحة <output id="gapOut" class="stat">0%</output>
</label>
<input type="range" id="gap" min="0" max="50" value="0">
</div>
<button class="subtle" id="reset">إعادة ضبط هذا التأثير</button>
<button class="primary apply" id="settingsApply">عرض النتيجة</button>
<p class="small" id="qualityNote">
</p>
</dialog>
<dialog id="singleDialog">
<div class="dialog-head">
<h2 id="singleTitle">الصورة</h2>
<button class="close" id="singleClose" aria-label="إغلاق الصورة">×</button>
</div>
<div class="single-wrap">
<canvas id="single">
</canvas>
</div>
<button class="primary apply" id="singleSave">تحميل هذه الصورة</button>
</dialog>
<dialog id="gallery">
<div class="dialog-head">
<h2>حفظ الصور في الاستديو</h2>
<button class="close" id="galleryClose" aria-label="إغلاق الحفظ">×</button>
</div>
<p id="galleryHelp">
</p>
<div class="gallery-grid" id="galleryGrid">
</div>
<button class="primary" id="shareReady">فتح خيارات حفظ الصور</button>
<p id="shareStatus" role="status" aria-live="polite">
</p>
</dialog>
<script>
'use strict';
const $=id=>document.getElementById(id);
const MODES=[['strips','شرائح X'],['panorama','بانوراما بالسحب'],['zoom','اقترب تدريجيًا'],['details','الصورة وتفاصيلها'],['color','لون وسط الرمادي'],['editorial','لوحة تحريرية']];
const defaults={count:12,fit:'cover',ratio:'0.8',zoom:3,color:'#d29940',tolerance:30,template:'triptych',background:'#eee9df',order:'rtl',curve:0,gap:0};
const options={};
for(const [id] of MODES)options[id]={...defaults,count:id==='strips'?12:id==='details'?3:4,fit:id==='zoom'||id==='details'?'contain':'cover',focus:{x:.5,y:.5},points:[{x:.3,y:.35},{x:.7,y:.6},{x:.5,y:.75}],active:0};
let mode='strips',image=null,filename='sharaeh',busy=false,renderFrame=0,singleIndex=0,sourceRect=null,galleryFiles=[],galleryURLs=[];
const opt=()=>options[mode];
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
function canvas(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c;}
function imageSize(){return {w:image.naturalWidth||image.width,h:image.naturalHeight||image.height};}
function ratio(o){return o.ratio==='source'?imageSize().w/imageSize().h:+o.ratio;}
function countFor(m,o){return m==='color'||m==='editorial'?1:m==='details'?o.count+1:o.count;}
function cropFor(r,focus,z=1){const {w,h}=imageSize();let cw=Math.min(w,h*r)/z,ch=cw/r;return {x:clamp(focus.x*w-cw/2,0,w-cw),y:clamp(focus.y*h-ch/2,0,h-ch),w:cw,h:ch};}
function cropRect(m,i,o){const {w,h}=imageSize(),r=ratio(o);
 if(m==='strips'||m==='panorama'){const j=o.order==='rtl'?o.count-1-i:i,l=Math.round(j*w/o.count),right=Math.round((j+1)*w/o.count),inset=m==='strips'?Math.round((right-l)*o.gap/200):0;return {x:l+inset,y:0,w:Math.max(1,right-l-2*inset),h};}
 if(m==='zoom'&&i===0)return {x:0,y:0,w,h};
 if(m==='zoom')return cropFor(r,o.focus,1+(o.zoom-1)*i/Math.max(1,o.count-1));
 if(m==='details'&&i>0)return cropFor(r,o.points[(i-1)%o.points.length],o.zoom);
 return {x:0,y:0,w,h};
}
function dimensions(m,i,o,maxEdge){const b=cropRect(m,i,o);let w,h;
 if(m==='strips'||m==='color'){w=b.w;h=b.h;}
 else if(m==='editorial'){w=Math.min(1800,imageSize().w);h=w*(o.template==='magazine'?1.25:.75);const boxes=editorialBoxes(w,h,o);let scale=1;boxes.forEach((box,j)=>{const src=j?cropFor(box[2]/box[3],o.points[(j-1)%o.points.length],o.zoom):imageSize();scale=Math.min(scale,src.w/box[2],src.h/box[3]);});w*=scale;h*=scale;}
 else{const r=ratio(o);w=Math.min(b.w,b.h*r);h=w/r;}
 const s=Math.min(1,maxEdge/Math.max(w,h));return {w:Math.max(1,Math.round(w*s)),h:Math.max(1,Math.round(h*s))};
}
function drawFit(ctx,b,box,fit,focus,background){ctx.fillStyle=background;ctx.fillRect(box.x,box.y,box.w,box.h);let sx=b.x,sy=b.y,sw=b.w,sh=b.h,dx=box.x,dy=box.y,dw=box.w,dh=box.h;
 if(fit==='cover'){const r=dw/dh;if(sw/sh>r){const nw=sh*r;sx+=clamp(focus.x)* (sw-nw);sw=nw;}else{const nh=sw/r;sy+=clamp(focus.y)*(sh-nh);sh=nh;}}
 else{const s=Math.min(dw/sw,dh/sh);dw=sw*s;dh=sh*s;dx+=(box.w-dw)/2;dy+=(box.h-dh)/2;}
 ctx.drawImage(image,sx,sy,sw,sh,dx,dy,dw,dh);
}
function roundedPath(ctx,w,h,r){r=Math.min(w/2,h/2,r);ctx.beginPath();ctx.moveTo(r,0);ctx.lineTo(w-r,0);ctx.quadraticCurveTo(w,0,w,r);ctx.lineTo(w,h-r);ctx.quadraticCurveTo(w,h,w-r,h);ctx.lineTo(r,h);ctx.quadraticCurveTo(0,h,0,h-r);ctx.lineTo(0,r);ctx.quadraticCurveTo(0,0,r,0);ctx.closePath();}
function hue(r,g,b){r/=255;g/=255;b/=255;const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;let h=0;if(d)h=max===r?((g-b)/d)%6:max===g?(b-r)/d+2:(r-g)/d+4;return {h:(h*60+360)%360,s:max?d/max:0};}
function selectiveColor(ctx,w,h,o){const d=ctx.getImageData(0,0,w,h),a=d.data,hex=o.color.slice(1),rgb=[0,2,4].map(p=>parseInt(hex.slice(p,p+2),16)),target=hue(...rgb),spread=o.tolerance*1.8;
 for(let p=0;p<a.length;p+=4){const current=hue(a[p],a[p+1],a[p+2]);let keep;
 if(target.s<.12){const dist=Math.hypot(a[p]-rgb[0],a[p+1]-rgb[1],a[p+2]-rgb[2]);keep=clamp((o.tolerance*3-dist)/20);}
 else{const delta=Math.abs(current.h-target.h),distance=Math.min(delta,360-delta);keep=clamp((spread-distance)/12)*clamp(current.s/.18);}
 const grey=.2126*a[p]+.7152*a[p+1]+.0722*a[p+2];for(let c=0;c<3;c++)a[p+c]=grey+(a[p+c]-grey)*keep;}
 ctx.putImageData(d,0,0);
}
function renderOutput(m,i,o,maxEdge=2200){const dim=dimensions(m,i,o,maxEdge),c=canvas(dim.w,dim.h),ctx=c.getContext('2d',{willReadFrequently:m==='color'}),w=c.width,h=c.height,b=cropRect(m,i,o);ctx.imageSmoothingQuality='high';
 if(m==='strips'){ctx.save();roundedPath(ctx,w,h,w*.5*o.curve/100);ctx.clip();ctx.drawImage(image,b.x,b.y,b.w,b.h,0,0,w,h);ctx.restore();}
 else if(m==='editorial')drawEditorial(ctx,w,h,o);
 else if(m==='color'){ctx.drawImage(image,0,0,w,h);selectiveColor(ctx,w,h,o);}
 else{drawFit(ctx,b,{x:0,y:0,w,h},(m==='zoom'&&i>0)||(m==='details'&&i>0)?'cover':o.fit,o.focus,o.background);}
 return c;
}
function editorialBoxes(w,h,o){const pad=Math.max(4,w*.024),g=pad;let boxes;
 if(o.template==='grid'){const bw=(w-3*pad)/2,bh=(h-3*pad)/2;boxes=[[pad,pad,bw,bh],[2*pad+bw,pad,bw,bh],[pad,2*pad+bh,bw,bh],[2*pad+bw,2*pad+bh,bw,bh]];}
 else if(o.template==='magazine'){const bh=(h-3*pad)*.65,bw=(w-3*pad)/2;boxes=[[pad,pad,w-2*pad,bh],[pad,2*pad+bh,bw,h-3*pad-bh],[2*pad+bw,2*pad+bh,bw,h-3*pad-bh]];}
 else{const main=(w-3*pad)*.65,small=w-3*pad-main,bh=(h-3*pad)/2;boxes=[[pad,pad,main,h-2*pad],[2*pad+main,pad,small,bh],[2*pad+main,2*pad+bh,small,bh]];}
 return boxes;
}
